name: Build label agent

on:
  push:
    paths: [ "label-agent/**", ".github/workflows/label-agent.yml" ]
  pull_request:
    paths: [ "label-agent/**", ".github/workflows/label-agent.yml" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest  # cross-builds the Windows exe (EnableWindowsTargeting)

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Publish TurboLabel.exe
        run: dotnet publish label-agent/src/TurboLabel.csproj -c Release -r win-x64 --self-contained -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o out

      - uses: actions/upload-artifact@v4
        with:
          name: TurboLabel
          path: out/TurboLabel.exe
