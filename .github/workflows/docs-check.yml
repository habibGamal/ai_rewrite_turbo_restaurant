name: Docs Check

on:
  pull_request:
  push:
    branches:
      - master

jobs:
  docs-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: docs/package-lock.json
      - name: Run docs check and VitePress build
        run: bash scripts/docs-check.sh --build
